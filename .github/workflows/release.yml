name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: manifest
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "cls-eedi") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" || "$version" == *+* ]]; then
            echo "::error::Expected a tag matching Cargo.toml (v$version) without build metadata."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the package and check for an identical previous publication
        id: package
        run: |
          cargo package --locked
          sha=$(sha256sum "target/package/cls-eedi-$VERSION.crate" | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          # The crate already exists on crates.io. The sparse index has one JSON record per version.
          curl --fail --silent --show-error --retry 3 https://index.crates.io/cl/s-/cls-eedi -o "$RUNNER_TEMP/index"
          existing=$(jq -r --arg v "$VERSION" 'select(.vers == $v) | if .yanked then "yanked" else .cksum end' "$RUNNER_TEMP/index")
          if [[ -z "$existing" ]]; then
            echo 'new=true' >> "$GITHUB_OUTPUT"
          elif [[ "$existing" != "$sha" ]]; then
            echo "::error::Registry version $VERSION is yanked or its checksum differs."
            exit 1
          fi
      - name: Exchange GitHub OIDC identity for a short-lived crates.io token
        if: steps.package.outputs.new == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish cls-eedi
        if: steps.package.outputs.new == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes for the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"

  formula:
    needs: [version, publish]
    if: "!contains(github.ref_name, '-')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test the formula against the crates.io archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA256: ${{ needs.publish.outputs.sha256 }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          packaging/homebrew/formula.sh "$VERSION" "$SHA256" > "$RUNNER_TEMP/cls-eedi.rb"
          brew tap-new --no-git local/release-check
          cp "$RUNNER_TEMP/cls-eedi.rb" "$(brew --repo local/release-check)/Formula/cls-eedi.rb"
          if brew command trust >/dev/null 2>&1; then brew trust --formula local/release-check/cls-eedi; fi
          brew install --build-from-source local/release-check/cls-eedi
          brew test local/release-check/cls-eedi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: ${{ runner.temp }}/cls-eedi.rb
          if-no-files-found: error

  # The homebrew environment holds the App credentials for Contents write access to hupe1980/homebrew-tap.
  tap:
    needs: [version, github-release, formula]
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: formula
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app.outputs.token }}
          path: tap
      - name: Publish the tested stable formula
        working-directory: tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p Formula
          git config user.name "cls-eedi release"
          git config user.email "cls-eedi-release@users.noreply.github.com"
          # Reapply to the latest tap head if another project publishes concurrently.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if [[ -f Formula/cls-eedi.rb ]]; then
              old=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Formula/cls-eedi.rb)
              if [[ -z "$old" ]]; then echo "::error::Cannot read existing formula version"; exit 1; fi
              if dpkg --compare-versions "$old" gt "$VERSION"; then exit 0; fi
            fi
            cp ../formula/cls-eedi.rb Formula/cls-eedi.rb
            git add Formula/cls-eedi.rb
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "cls-eedi $VERSION"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
