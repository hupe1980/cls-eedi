mqtt {
  peer_cert_as_username = cn
  peer_cert_as_clientid = cn
}
listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    verify = verify_peer
    fail_if_no_peer_cert = true
    cacertfile = "/test-listener/ca.crt"
    certfile = "/test-listener/server.crt"
    keyfile = "/test-listener/server.key"
  }
}
authorization {
  no_match = deny
  deny_action = ignore
  sources = [{ type = file, enable = true, path = "/test-listener/acl.conf" }]
}
