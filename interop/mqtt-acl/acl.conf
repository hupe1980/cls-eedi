%% Device certificates are issued with unique CNs by the operator's private CA.
{allow, {username, "device-a"}, subscribe, [{eq, "grid/down/A/#"}]}.
{allow, {username, "device-a"}, publish, ["grid/up/A/#"]}.
{allow, {username, "device-b"}, subscribe, [{eq, "grid/down/B/#"}]}.
{allow, {username, "device-b"}, publish, ["grid/up/B/#"]}.
{allow, {username, "backend"}, subscribe, [{eq, "grid/up/A/#"}, {eq, "grid/up/B/#"}]}.
{allow, {username, "backend"}, publish, ["grid/down/A/#", "grid/down/B/#"]}.
{deny, all}.
